name: "Lint PR"

on:
  workflow_call:

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        id: lint_pr_title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report PR title error
        if: always() && (steps.lint_pr_title.outputs.error_message != null)
        env:
          ERROR_MESSAGE: ${{ steps.lint_pr_title.outputs.error_message }}
        run: |
          {
            echo "## PR title does not follow Conventional Commits"
            echo
            echo "We require pull request titles to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/) and it looks like your proposed title needs to be adjusted."
            echo
            echo "Details:"
            echo
            echo '```'
            printf '%s\n' "$ERROR_MESSAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
