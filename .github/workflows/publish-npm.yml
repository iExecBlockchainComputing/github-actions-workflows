name: Publish Package NPM

on:
  workflow_call:
    inputs:
      scope:
        description: "NPM package scope (e.g., @iexec)"
        default: "@iexec"
        type: string
      node-version:
        description: "Node.js version to use"
        default: "24"
        type: string
      registry:
        description: "NPM registry URL"
        default: "https://registry.npmjs.org"
        type: string
      access:
        description: "Package access (public/restricted)"
        default: "public"
        type: string
      provenance:
        description: "Enable npm provenance"
        default: true
        type: boolean
      install-command:
        description: "Install dependencies command (single command, no shell operators or multi-line scripts)"
        default: "npm ci"
        type: string
      build-command:
        description: "Build package command (single command, no shell operators or multi-line scripts)"
        default: "npm run build"
        type: string
      run-tests:
        description: "Execute unit tests step"
        default: false
        type: boolean
      test-command:
        description: "Run unit tests command (single command, no shell operators or multi-line scripts)"
        default: "npm test --if-present"
        type: string
      lint-command:
        description: "Run linting command (single command, no shell operators or multi-line scripts)"
        default: "npm run lint --if-present"
        type: string
      type-check-command:
        description: "Run type-checking command (single command, no shell operators or multi-line scripts)"
        default: "npm run check-types --if-present"
        type: string
      format-check-command:
        description: "Run format-checking command (single command, no shell operators or multi-line scripts)"
        default: "npm run check-format --if-present"
        type: string
      environment:
        description: "GitHub environment"
        default: "production"
        type: string
      tag:
        description: "npm publish tag (e.g., latest, nightly)"
        default: ""
        type: string
      working-directory:
        description: "Directory containing package.json"
        default: ""
        type: string
      artifact-name:
        description: "Name of an artifact to download before the build (leave empty to skip)"
        default: ""
        type: string
      artifact-path:
        description: "Destination path for the downloaded artifact"
        default: ""
        type: string
      version:
        description: "Version to publish (leave empty to use package.json version)"
        default: ""
        type: string
      dry-run:
        description: "Run in dry-run mode (the package will not be published)"
        default: false
        type: boolean
    secrets:
      npm-token:
        description: "NPM auth token (required unless `dry-run: true` or workflow is called by a trusted publisher)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download extra artifact
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry }}
          scope: ${{ inputs.scope }}

      - name: Enable Socket Firewall
        uses: SocketDev/action@be1f253a41351d59095f8d7f1425985097dd1054 # unreleased: post-v1.3.2, includes sfw shims
        with:
          mode: firewall-free
          shims: true

      - name: Ensure npm version
        if: ${{ !inputs.dry-run }}
        run: |
          if [ -n "${{ secrets.npm-token }}" ]; then
            echo "npm-token secret is set not using OIDC"
          elif [ -n "$(npx semver@7.8.5 -r ">=11.5.1" "$(npm -v)")" ]; then
            echo "OIDC trusted publishing supported by current npm version"
          else
            echo "OIDC trusted publishing requires npm >= 11.5.1 (Node.js >= 24.5.0), current npm is $(npm -v)"
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: ${INPUTS_INSTALL_COMMAND}
        env:
          INPUTS_INSTALL_COMMAND: ${{ inputs.install-command }}

      - name: Override version
        if: ${{ inputs.version != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          npm pkg set version="${INPUTS_VERSION}"

      - name: Run build
        working-directory: ${{ inputs.working-directory }}
        run: ${INPUTS_BUILD_COMMAND}
        env:
          INPUTS_BUILD_COMMAND: ${{ inputs.build-command }}

      - name: Run type checks
        working-directory: ${{ inputs.working-directory }}
        run: ${INPUTS_TYPE_CHECK_COMMAND}
        env:
          INPUTS_TYPE_CHECK_COMMAND: ${{ inputs.type-check-command }}

      - name: check format
        working-directory: ${{ inputs.working-directory }}
        run: ${INPUTS_FORMAT_CHECK_COMMAND}
        env:
          INPUTS_FORMAT_CHECK_COMMAND: ${{ inputs.format-check-command }}

      - name: Run linting
        working-directory: ${{ inputs.working-directory }}
        run: ${INPUTS_LINT_COMMAND}
        env:
          INPUTS_LINT_COMMAND: ${{ inputs.lint-command }}

      - name: Run unit tests
        if: ${{ inputs.run-tests }}
        working-directory: ${{ inputs.working-directory }}
        run: ${INPUTS_TEST_COMMAND}
        env:
          INPUTS_TEST_COMMAND: ${{ inputs.test-command }}

      - name: Publish package
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
          TAG: ${{ inputs.tag }}
          ACCESS: ${{ inputs.access }}
        run: |
          opts=(--access "$ACCESS")
          if [ -n "$TAG" ]; then
            opts+=(--tag "$TAG")
          fi

          if [ "${{ inputs.dry-run }}" = "true" ]; then
            npm pkg set version="$(npm pkg get version | sed 's/"//g')-dry-run"
            opts+=(--dry-run --tag dry-run)
          fi

          if [ "${{ inputs.provenance }}" = "true" ]; then
            opts+=(--provenance)
          fi

          npm publish "${opts[@]}"
