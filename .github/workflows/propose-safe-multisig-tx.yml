name: 'Propose Safe Multisig Transaction'
on:
  workflow_call:
    inputs:
      safe-address:
        description: 'Address of the Safe contract'
        required: true
        type: string
      transaction-to:
        description: 'Target address of the transaction'
        required: true
        type: string
      transaction-value:
        description: 'Value to send in the transaction (in wei, default: 0)'
        required: false
        default: '0'
        type: string
      transaction-data:
        description: 'Transaction data/calldata'
        required: true
        type: string
      dry-run:
        description: 'If true, validate and prepare the transaction without proposing it'
        required: false
        default: false
        type: boolean
      environment:
        description: >-
          Name of the caller's GitHub Environment to run in. When set, the job reads the
          secrets directly from that environment (RPC_URL, SAFE_PROPOSER_PRIVATE_KEY,
          SAFE_API_KEY) and the caller must use `secrets: inherit`. Leave empty to pass
          the secrets explicitly via the `secrets:` block instead.
        required: false
        default: ''
        type: string
    secrets:
      rpc-url:
        description: 'RPC URL for the blockchain network (explicit passing; omit when using `environment`)'
        required: false
      safe-proposer-private-key:
        description: 'Private key of the proposer wallet (explicit passing; omit when using `environment`)'
        required: false
      safe-api-key:
        description: 'Safe API key for transaction service (explicit passing; omit when using `environment`)'
        required: false
      RPC_URL:
        description: 'RPC URL, sourced from the caller environment when `environment` is set'
        required: false
      SAFE_PROPOSER_PRIVATE_KEY:
        description: 'Proposer private key, sourced from the caller environment when `environment` is set'
        required: false
      SAFE_API_KEY:
        description: 'Safe API key, sourced from the caller environment when `environment` is set'
        required: false
    outputs:
      tx-hash:
        description: 'Hash of the Safe transaction'
        value: ${{ jobs.propose-transaction.outputs.tx-hash }}
      tx-details:
        description: 'Created transaction details'
        value: ${{ jobs.propose-transaction.outputs.tx-details }}

jobs:
  propose-transaction:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      tx-hash: ${{ steps.safe-transaction.outputs.tx-hash }}
      tx-details: ${{ steps.safe-transaction.outputs.tx-details }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: iExecBlockchainComputing/github-actions-workflows

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: ./propose-safe-multisig-tx

      - name: Build action
        run: npm run build
        working-directory: ./propose-safe-multisig-tx

      - name: Check required secrets are resolved
        env:
          RPC_URL: ${{ secrets.RPC_URL || secrets.rpc-url }}
          SAFE_PROPOSER_PRIVATE_KEY: ${{ secrets.SAFE_PROPOSER_PRIVATE_KEY || secrets.safe-proposer-private-key }}
          SAFE_API_KEY: ${{ secrets.SAFE_API_KEY || secrets.safe-api-key }}
        run: |
          missing=()
          if [ -z "$RPC_URL" ]; then missing+=("RPC_URL / rpc-url"); fi
          if [ -z "$SAFE_PROPOSER_PRIVATE_KEY" ]; then missing+=("SAFE_PROPOSER_PRIVATE_KEY / safe-proposer-private-key"); fi
          if [ -z "$SAFE_API_KEY" ]; then missing+=("SAFE_API_KEY / safe-api-key"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing secret(s): ${missing[*]}. Pass them via the 'secrets:' block, or set 'environment:' and use 'secrets: inherit' so they are read from that environment."
            exit 1
          fi

      - name: Propose Safe Transaction
        run: npm run propose
        working-directory: ./propose-safe-multisig-tx
        env:
          RPC_URL: ${{ secrets.RPC_URL || secrets.rpc-url }}
          SAFE_ADDRESS: ${{ inputs.safe-address }}
          TRANSACTION_TO: ${{ inputs.transaction-to }}
          TRANSACTION_VALUE: ${{ inputs.transaction-value }}
          TRANSACTION_DATA: ${{ inputs.transaction-data }}
          SAFE_PROPOSER_PRIVATE_KEY: ${{ secrets.SAFE_PROPOSER_PRIVATE_KEY || secrets.safe-proposer-private-key }}
          SAFE_API_KEY: ${{ secrets.SAFE_API_KEY || secrets.safe-api-key }}
          DRY_RUN: ${{ inputs.dry-run }}
        id: safe-transaction
