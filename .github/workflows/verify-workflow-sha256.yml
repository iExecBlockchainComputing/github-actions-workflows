name: verify-workflow-sha256

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/*.yml'
      - 'release-please-config.json'
      - 'scripts/compute-workflow-sha256.sh'
      - '**/workflow-sha256'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/*.yml'
      - 'release-please-config.json'
      - 'scripts/compute-workflow-sha256.sh'
      - '**/workflow-sha256'

permissions:
  contents: read

concurrency:
  group: verify-workflow-sha256-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-workflow-sha256:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify workflow-sha256 files are up to date
        run: bash scripts/compute-workflow-sha256.sh --check
