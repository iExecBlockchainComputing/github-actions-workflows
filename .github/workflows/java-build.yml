name: Build, Test and Publish Java Project

on:
  workflow_call:
    inputs:
      java-version:
        description: "Java version to use"
        default: "21"
        type: string
      java-distribution:
        description: "Java distribution to use (temurin, zulu, corretto, ...)"
        default: "temurin"
        type: string
      gradle-build-task:
        description: "Gradle task running the build and the unit tests"
        default: "build"
        type: string
      working-directory:
        description: "Directory holding the Gradle wrapper"
        default: "."
        type: string
      refresh-dependencies:
        description: "Run Gradle with --refresh-dependencies. Required while the project depends on `-NEXT-SNAPSHOT` artifacts, whose resolution Gradle otherwise caches for 24h"
        default: true
        type: boolean
      sonar:
        description: "Run the SonarQube/SonarCloud analysis (requires the `sonar-token` secret)"
        default: false
        type: boolean
      run-itest:
        description: "Run the `itest` Gradle task after the unit tests"
        default: false
        type: boolean
      publish-jars:
        description: "Publish jar artifacts to a Maven repository (requires `maven-repository-url` and the `nexus-*` secrets)"
        default: false
        type: boolean
      mvn-repository-url:
        description: "Maven repository the jars are published to, passed to Gradle as `-PmvnRepositoryUrl`"
        default: ""
        type: string
      dockerhub-login:
        description: "Log in to Docker Hub before the build. Enable it when the tests pull images, e.g. Testcontainers, to avoid anonymous pull rate limits"
        default: false
        type: boolean
      upload-jar:
        description: "Upload the built jar as an artifact, so that a later job can build an OCI image from it"
        default: false
        type: boolean
      artifact-name:
        description: "Name of the uploaded jar artifact"
        default: "boot-jar"
        type: string
      artifact-retention-days:
        description: "Retention of the uploaded jar artifact, in days"
        default: 1
        type: number
      runner:
        description: "GitHub Actions runner label"
        default: "ubuntu-latest"
        type: string
    secrets:
      mvn-repository-username:
        description: "Username for the private Maven repository, exposed to Gradle as `mvnRepositoryUsername`"
        required: false
      mvn-repository-password:
        description: "Password for the private Maven repository, exposed to Gradle as `mvnRepositoryPassword`"
        required: false
      dockerhub-username:
        description: "Docker Hub username (used only when `dockerhub-login: true`)"
        required: false
      dockerhub-password:
        description: "Docker Hub token (used only when `dockerhub-login: true`)"
        required: false
      sonar-token:
        description: "SonarCloud token (used only when `sonar: true`)"
        required: false
    outputs:
      version:
        description: "Gradle project version"
        value: ${{ jobs.build.outputs.version }}
      jar-path:
        description: "Path of the built jar, relative to the workspace. Feed it to `docker-build.yml` as `build-args: jar=<path>`"
        value: ${{ jobs.build.outputs.jar-path }}
      artifact-name:
        description: "Name of the uploaded jar artifact, echoed back for convenience"
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    runs-on: ${{ inputs.runner }}

    outputs:
      version: ${{ steps.gradle-properties.outputs.version }}
      jar-path: ${{ steps.gradle-properties.outputs.jar-path }}
      artifact-name: ${{ inputs.artifact-name }}

    steps:
      - name: Validate publishing inputs
        if: ${{ inputs.publish-jars && inputs.maven-repository-url == '' }}
        run: |
          echo "❌ Error: publish-jars is enabled but maven-repository-url is empty"
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Sonar needs the full history to attribute lines to authors, and the Gradle
          # build derives the project version from the tag pointing at HEAD.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Login to Docker Hub
        if: ${{ inputs.dockerhub-login }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.dockerhub-username }}
          password: ${{ secrets.dockerhub-password }}

      # Inputs are passed through the environment rather than interpolated into the
      # script, so that a crafted input cannot inject shell commands.
      - name: Build and run unit tests
        working-directory: ${{ inputs.working-directory }}
        env:
          ORG_GRADLE_PROJECT_nexusUser: ${{ secrets.nexus-username }}
          ORG_GRADLE_PROJECT_nexusPassword: ${{ secrets.nexus-password }}
          SONAR_TOKEN: ${{ secrets.sonar-token }}
          BUILD_TASK: ${{ inputs.gradle-build-task }}
          WITH_SONAR: ${{ inputs.sonar }}
          REFRESH_DEPENDENCIES: ${{ inputs.refresh-dependencies }}
        run: |
          args=("$BUILD_TASK")
          if [ "$WITH_SONAR" = "true" ]; then
            # The Sonar Gradle plugin reads the branch, pull request and repository
            # from the GITHUB_* variables, so no analysis property has to be passed.
            args+=("sonar")
          fi
          if [ "$REFRESH_DEPENDENCIES" = "true" ]; then
            args+=("--refresh-dependencies")
          fi
          ./gradlew "${args[@]}"

      - name: Run integration tests
        if: ${{ inputs.run-itest }}
        working-directory: ${{ inputs.working-directory }}
        env:
          ORG_GRADLE_PROJECT_nexusUser: ${{ secrets.nexus-username }}
          ORG_GRADLE_PROJECT_nexusPassword: ${{ secrets.nexus-password }}
        run: ./gradlew itest -i

      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            ${{ inputs.working-directory }}/**/build/test-results/**/*.xml
            ${{ inputs.working-directory }}/**/build/reports/jacoco/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Resolve project version and jar path
        id: gradle-properties
        working-directory: ${{ inputs.working-directory }}
        env:
          ORG_GRADLE_PROJECT_mvnRepositoryUsername: ${{ secrets.nexus-username }}
          ORG_GRADLE_PROJECT_mvnRepositoryPassword: ${{ secrets.nexus-password }}
        run: |
          properties=$(./gradlew -q properties)
          version=$(echo "$properties" | awk '/^version:/ {print $2}')
          # jarPathForOCI is defined by the iExec Java projects that ship an OCI image.
          jar_path=$(echo "$properties" | awk '/^jarPathForOCI:/ {print $2}')
          if [ -z "$jar_path" ]; then
            for candidate in build/libs/*.jar; do
              case "$candidate" in
                *-plain.jar) continue ;;
              esac
              if [ -f "$candidate" ]; then
                jar_path="$candidate"
                break
              fi
            done
          fi
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
          echo "jar-path=$jar_path" | tee -a "$GITHUB_OUTPUT"

      - name: Publish jars
        if: ${{ inputs.publish-jars }}
        working-directory: ${{ inputs.working-directory }}
        env:
          ORG_GRADLE_PROJECT_nexusUser: ${{ secrets.nexus-username }}
          ORG_GRADLE_PROJECT_nexusPassword: ${{ secrets.nexus-password }}
          MAVEN_REPOSITORY_URL: ${{ inputs.maven-repository-url }}
        run: ./gradlew publish -i -PnexusUrl="$MAVEN_REPOSITORY_URL"

      - name: Upload jar artifact
        if: ${{ inputs.upload-jar }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ steps.gradle-properties.outputs.jar-path }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
